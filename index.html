<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><title>QRmed! 2.0</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png"><link rel="stylesheet" href="./styles.css"></head>
<body>
<div class="phone-bg"><div class="glow"></div></div>
<main class="app">
<section id="onboarding" class="screen">
  <div class="top-status"><span>●●●○</span><span id="timeNow">21:41</span></div>
  <div class="hero-art">
    <svg viewBox="0 0 120 120"><rect x="10" y="10" width="36" height="36" rx="6" fill="none" stroke="#fff" stroke-width="5"/><rect x="74" y="10" width="36" height="36" rx="6" fill="none" stroke="#fff" stroke-width="5"/><rect x="10" y="74" width="36" height="36" rx="6" fill="none" stroke="#fff" stroke-width="5"/><rect x="20" y="20" width="16" height="16" fill="#fff"/><rect x="84" y="20" width="16" height="16" fill="#fff"/><rect x="20" y="84" width="16" height="16" fill="#fff"/><path d="M74 74h12v12H74zM92 74h12v12H92zM74 92h12v12H74zM92 92h12v12H92z" fill="#fff"/></svg>
    <div class="curve"></div>
  </div>
  <div class="sheet-hero">
    <h1>Get Started</h1><p>Scan QR mudah dan buat QR sendiri dengan cepat. Offline, install di HP.</p>
    <input id="nick" placeholder="Nickname kamu" autocomplete="off">
    <button id="startBtn" class="fab">→</button>
  </div>
</section>

<section id="home" class="screen hidden">
  <div class="status"><span>21:41</span><span class="status-icons">▂▄▆</span></div>
  <div class="header"><div><h2 id="hello">Halo, Kamu!</h2><p>Siap scan?</p></div><span class="bell">●</span></div>
  <div class="segment"><button class="active">Home</button><button id="segScan">Scan</button><button id="segCreate">Buat</button></div>
  <div class="grid">
    <button class="tile primary" data-go="scan"><i>⌗</i><b>Scan QR</b><small>Lens full</small></button>
    <button class="tile" data-go="create"><i>＋</i><b>Buat QR</b><small>QR Lens</small></button>
    <button class="tile" data-go="history"><i>↺</i><b>Riwayat</b><small>History</small></button>
    <button class="tile" data-go="profile"><i>◉</i><small>Update</small></button>
  </div>
  <div class="sec"><div class="sec-head"><h3>Terakhir</h3><button class="link">Lihat semua</button></div><div id="recent" class="list empty">Belum ada.</div></div>
</section>

<section id="scan" class="screen scan-screen hidden">
  <div id="reader" class="scan-reader"></div>
  <div class="scan-ui">
    <div class="scan-top"><span class="status-chip">21:41</span><span class="status-chip">●●●○</span></div>
    <div class="scan-segment"><button class="active">Scan</button><button id="scan2create">Create</button></div>
    <div class="scan-frame"><div class="qr-box"><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="scanline"></div><span class="center-label" id="lensStatus">Arahkan ke QR…</span></div></div>
    <div class="scan-bottom"><button class="fab" id="bigFab">◎</button></div>
    <div class="scan-mini"><button>▭</button><button>✦</button></div>
  </div>
  <div id="bigToast" class="big-toast hidden">✓ QR BERHASIL DIBACA!</div>
  <article id="scanResult" class="result-sheet hidden"></article>
</section>

<section id="create" class="screen hidden">
  <div class="status"><button class="back" data-go="home">‹</button><span class="status-chip">21:41</span></div>
  <div class="card"><h2>QR Code</h2><div class="tabs"><button class="active" data-t="general">Umum</button><button class="tab" data-t="qrmed">QRmed 2</button><button class="tab" data-t="wifi">WiFi</button></div>
  <form id="createForm" class="form">
    <fieldset class="panel active" data-p="general"><label>Isi QR<input id="gText" placeholder="https://… atau teks"></label><label>Label (riwayat)<input id="gLabel" placeholder="opsional"></label></fieldset>
    <fieldset class="panel" data-p="qrmed"><label>Nama<input id="mName" placeholder="cth: Andi"></label><label>Catatan<input id="mNote" placeholder="cth: Booth A"></label></fieldset>
    <fieldset class="panel" data-p="wifi"><label>SSID<input id="wSsid" placeholder="Nama WiFi"></label><label>Password<input id="wPass" placeholder="Password"></label></fieldset>
    <div class="row"><button type="button" class="btn-ghost" id="resetCreate">Reset</button><button class="btn-primary">Buat QR</button></div>
  </form></div>
  <article id="preview" class="card center hidden"></article>
</section>

<section id="history" class="screen hidden">
  <div class="status"><button class="back" data-go="home">‹</button><span>Riwayat</span></div>
  <div class="search-row"><input id="hSearch" placeholder="Cari hasil scan…"><button id="exportBtn" class="btn-ghost">Export</button></div>
  <div id="hList" class="list"></div>
</section>

<section id="profile" class="screen hidden">
  <div class="status"><button class="back" data-go="home">‹</button><span>Profil & Update</span></div>
  <div class="card"><div class="prof"><span class="avatar" id="profAva">A</span><div><b id="profName">—</b><small>QRmed! 2.0</small></div></div>
  <div class="row"><button id="wipeBtn" class="btn-ghost danger">Hapus Data</button></div></div>
  <div class="card update-card"><div><b>QRmed! 2.0.0</b><small>build lokal</small></div><span class="badge">v2</span><div class="row"><button id="checkUpdate" class="btn-primary">Download Update</button><button id="clearCache" class="btn-ghost">Bersihkan Cache</button></div><div id="updateMsg" class="muted"></div></div>
</section>

<nav class="nav"><button class="active" data-go="home"><i>⌂</i><small>Home</small></button><button id="navScan"><i>⌗</i><small>Scan</small></button><button class="fab-nav">◎</button><button data-go="create"><i>＋</i><small>Create</small></button><button data-go="profile"><i>◉</i><small>Profil</small></button></nav>
</main>
<div id="toast" class="toast"></div>
<script src="./app.js"></script>
</body></html>
