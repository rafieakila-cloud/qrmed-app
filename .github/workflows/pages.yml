name: Deploy QRmed PWA ke GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Siapkan folder publik
        run: |
          mkdir _site
          cp index.html styles.css app.js manifest.webmanifest sw.js _site/
          cp -R vendor icons _site/
          mkdir -p _site/qrmed-lens
          cp qrmed-lens/index.html qrmed-lens/styles.css qrmed-lens/app.js qrmed-lens/manifest.webmanifest qrmed-lens/sw.js _site/qrmed-lens/
          cp -R qrmed-lens/vendor qrmed-lens/icons _site/qrmed-lens/
      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
